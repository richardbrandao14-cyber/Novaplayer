[package]
name = "nova-player"
version = "0.1.0"
description = "NOVA PLAYER — Windows desktop"
authors = ["NOVA PLAYER"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "nova_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nova-player"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "=0.3.34"
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }
sha2 = "=0.10.9"
encoding_rs = "=0.8.42"
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = [], optional = true }
rfd = { version = "=0.17.2", default-features = false, optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
