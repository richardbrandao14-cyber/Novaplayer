name: Validate NOVA PLAYER
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --locked --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup show
      - name: Reutilizar dependências Rust verificadas
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-rust-1.95-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**/*.rs', 'src-tauri/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.95-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: npm ci
      - name: Preparar motor de reprodução com hash fixado
        run: ./scripts/prepare-player.ps1
      - name: Prova de conceito libmpv Windows (decodificação local)
        run: |
          $env:NOVA_MPV_DLL = Join-Path $PWD 'player-runtime/libmpv-2.dll'
          cargo test --manifest-path src-tauri/Cargo.toml --locked windows_mpv_decodes_local_video_and_pcm_audio -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath windows-clippy.log
          $stepExit = $LASTEXITCODE
          if ($stepExit -ne 0) {
            '### windows-clippy — diagnóstico' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content windows-clippy.log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit $stepExit
          }
      - run: |
          npm run rust:test 2>&1 | Tee-Object -FilePath windows-tests.log
          $stepExit = $LASTEXITCODE
          if ($stepExit -ne 0) {
            '### windows-tests — diagnóstico' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content windows-tests.log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit $stepExit
          }
      - run: |
          npm run desktop:build -- --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath windows-build.log
          $stepExit = $LASTEXITCODE
          if ($stepExit -ne 0) {
            '### windows-build — diagnóstico' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content windows-build.log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit $stepExit
          }
      - name: Montar pacote portátil de teste
        run: Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/nova-player.exe player-runtime/nova-player.exe
      - name: Guardar executável de teste Windows
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAYER-Windows-x64-test
          path: player-runtime/
          if-no-files-found: error
          retention-days: 7
